services:
  py:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      - HF_HOME=/cache/huggingface
    volumes:
      - ./app:/usr/src/app
      - hf_cache:/cache/huggingface
    env_file:
      - .env
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
volumes:
  hf_cache: