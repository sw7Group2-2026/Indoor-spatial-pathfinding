services:
  py:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      - HF_HOME=/cache/huggingface
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
      - hf_cache:/cache/huggingface
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    command: ["-m", "uvicorn", "api.api:app", "--host", "0.0.0.0", "--port", "8000"]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
volumes:
  hf_cache: